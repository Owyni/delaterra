  <g transform="translate(88 340)">
    <circle cx="34" cy="34" r="32" fill="#FFFFFF" stroke="#DCE6D2" stroke-width="2"/>
    <circle cx="34" cy="36" r="18" fill="#6AA844"/>
    <circle cx="34" cy="36" r="13" fill="#BFE27F"/>
