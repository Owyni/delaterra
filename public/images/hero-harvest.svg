    <path d="M8 22H38M6 38H40M6 54H40M8 70H38M10 86H36" stroke="#C98F1E" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
    <path d="M2 58C-12 78 -8 106 20 116C12 96 14 75 2 58Z" fill="#5E8547"/>
    <path d="M44 54C58 76 54 106 24 116C34 96 32 72 44 54Z" fill="#466D36"/>
  </g>

  <!-- Carrot bunch -->
  <g transform="translate(362 126) rotate(18)">
    <path d="M18 28L32 134C33 142 21 144 18 135L4 32C2 20 16 18 18 28Z" fill="#EA7B2D"/>
    <path d="M36 32L52 126C53 134 42 136 39 128L22 36C20 25 34 23 36 32Z" fill="#F2913D"/>
    <path d="M12 24C4 4 14 -6 22 6C24 -8 34 -4 32 12C42 2 48 12 36 26" stroke="#4D783D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lettuce head -->
  <circle cx="310" cy="202" r="56" fill="#7DA45B"/>
  <path d="M262 194C272 158 312 150 342 168C362 182 362 222 332 238C294 252 254 226 262 194Z" fill="#9BC073"/>
  <path d="M284 186C298 172 326 176 336 196" stroke="#DCE6D2" stroke-width="3" stroke-linecap="round"/>

