    <linearGradient id="tomatoGrad" x1="0.3" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#F2634B"/>
      <stop offset="100%" stop-color="#BD2E1E"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0.2" y1="0.2" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E2711D"/>
    </linearGradient>
    <linearGradient id="cornGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE17D"/>
      <stop offset="100%" stop-color="#E4B038"/>
