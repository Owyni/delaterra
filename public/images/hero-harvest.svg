  <path d="M88 370C70 290 120 185 215 148C310 111 452 108 525 186C598 264 565 398 468 430C371 462 106 450 88 370Z" fill="#DCE6D2" opacity="0.65"/>

  <!-- Botanical leaves behind crate -->
  <path d="M168 235C118 190 112 128 156 96C198 122 214 185 185 235Z" fill="#71864F"/>
  <path d="M156 96C167 148 175 190 180 232" stroke="#DCE6D2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M472 225C522 178 532 120 486 90C444 122 436 180 462 225Z" fill="#244D36"/>
  <path d="M486 90C476 142 468 184 466 222" stroke="#9BB686" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M295 152C280 96 312 46 355 48C372 95 344 148 308 164Z" fill="#8EA768"/>

  <!-- Back produce inside crate -->
  <!-- Corn cob -->
  <g transform="translate(222 130) rotate(-14)">
