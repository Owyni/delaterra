<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#E7EFE0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#DCE6D2" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="crateFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C99B6B"/>
      <stop offset="100%" stop-color="#9E7147"/>
    </linearGradient>
    <linearGradient id="crateSlats" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B58658"/>
      <stop offset="50%" stop-color="#D2A779"/>
      <stop offset="100%" stop-color="#A87A4E"/>
    </linearGradient>
    <linearGradient id="avoOuter" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#4A6E35"/>
      <stop offset="100%" stop-color="#223D26"/>
