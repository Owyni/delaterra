  <circle cx="328" cy="252" r="38" fill="url(#tomatoGrad)"/>
  <ellipse cx="315" cy="236" rx="9" ry="5" transform="rotate(-25 315 236)" fill="#FFA898" opacity="0.55"/>
  <path d="M328 214L320 226L330 222L340 227L334 214L344 210L330 212L318 208Z" fill="#3B6B35"/>

  <!-- Green Lime & Serrano -->
  <ellipse cx="458" cy="262" rx="28" ry="22" transform="rotate(-18 458 262)" fill="#58943A"/>
  <path d="M168 274C186 244 226 248 242 268C222 280 186 286 168 274Z" fill="#3A7734"/>

  <!-- Ground shadow under crate -->
  <ellipse cx="320" cy="434" rx="205" ry="22" fill="#244D36" opacity="0.14"/>

  <!-- Wooden Harvest Crate -->
  <g transform="translate(132 268)">
    <!-- Back rim -->
    <rect x="12" y="0" width="352" height="28" rx="6" fill="#8C6039"/>
    <!-- Front slats -->
    <rect x="0" y="18" width="376" height="40" rx="8" fill="url(#crateSlats)"/>
    <rect x="0" y="66" width="376" height="38" rx="8" fill="url(#crateFront)"/>
    <rect x="0" y="112" width="376" height="42" rx="8" fill="url(#crateSlats)"/>
    <!-- Side vertical supports -->
    <rect x="16" y="14" width="24" height="144" rx="5" fill="#9A6C42"/>
    <rect x="336" y="14" width="24" height="144" rx="5" fill="#9A6C42"/>
    <!-- Crate label badge -->
    <rect x="124" y="54" width="128" height="62" rx="14" fill="#F6F5ED" stroke="#DCE6D2" stroke-width="2"/>
    <circle cx="152" cy="85" r="14" fill="#DCE6D2"/>
    <path d="M146 90C146 80 154 74 160 76C160 84 154 90 146 90Z" fill="#244D36"/>
    <text x="174" y="81" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#244D36">MICHOACÁN</text>
    <text x="174" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71864F">Cosecha directa</text>
  </g>

  <!-- Floating fresh accents in foreground -->
  <g transform="translate(454 358)">
    <circle cx="38" cy="38" r="36" fill="#FFFFFF" stroke="#DCE6D2" stroke-width="2"/>
    <path d="M38 18C48 18 56 30 56 42C56 54 48 60 38 60C28 60 20 54 20 42C20 30 28 18 38 18Z" fill="#E34B39"/>
    <path d="M38 18C34 11 40 8 44 13" stroke="#3D6E35" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="1.5" fill="#FFE8A3"/>
    <circle cx="44" cy="36" r="1.5" fill="#FFE8A3"/>
    <circle cx="38" cy="46" r="1.5" fill="#FFE8A3"/>
    <circle cx="30" cy="48" r="1.5" fill="#FFE8A3"/>
    <circle cx="46" cy="48" r="1.5" fill="#FFE8A3"/>
