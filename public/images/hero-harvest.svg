    <ellipse cx="26" cy="48" rx="7" ry="14" fill="#749854" opacity="0.35"/>
  </g>
  <g transform="translate(226 206) rotate(12)">
    <path d="M34 4C50 4 64 34 64 62C64 84 50 98 34 98C18 98 4 84 4 62C4 34 18 4 34 4Z" fill="#2E5434"/>
    <path d="M34 10C47 10 58 36 58 61C58 80 47 92 34 92C21 92 10 80 10 61C10 36 21 10 34 10Z" fill="#C9DE82"/>
    <circle cx="34" cy="64" r="15" fill="#7D4A2D"/>
